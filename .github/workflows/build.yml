name: Build and Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate_release:
    name: Validate release tag
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify tag matches package version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node -e "const expected = 'v' + require('./package.json').version; if (process.env.RELEASE_TAG !== expected) { console.error('Release tag ' + process.env.RELEASE_TAG + ' does not match package version ' + expected); process.exit(1); }"

  build_windows:
    name: Windows x64
    needs: validate_release
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          npm ci

      - name: Build Windows packages
        run: npm run dist

      - name: Upload Windows packages
        uses: actions/upload-artifact@v4
        with:
          name: desktop-windows-x64
          path: |
            dist/Crosstalk-*-windows-x64-installer.exe
            dist/Crosstalk-*-windows-x64-portable.exe
          if-no-files-found: error
          retention-days: 7

  build_macos:
    name: macOS ${{ matrix.arch }}
    needs: validate_release
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Verify runner architecture
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: |
          node -e "if (process.arch !== process.env.EXPECTED_ARCH) { console.error('Expected ' + process.env.EXPECTED_ARCH + ' runner, got ' + process.arch); process.exit(1); }"

      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          npm ci

      - name: Build macOS package
        run: npm run dist

      - name: Upload macOS package
        uses: actions/upload-artifact@v4
        with:
          name: desktop-macos-${{ matrix.arch }}
          path: dist/Crosstalk-*-macos-${{ matrix.arch }}.dmg
          if-no-files-found: error
          retention-days: 7

  build_linux:
    name: Linux x64
    needs: validate_release
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          npm ci

      - name: Build Linux package
        run: npm run dist

      - name: Upload Linux package
        uses: actions/upload-artifact@v4
        with:
          name: desktop-linux-x64
          path: dist/Crosstalk-*-linux-x86_64.AppImage
          if-no-files-found: error
          retention-days: 7

  create_release:
    name: Create draft GitHub Release
    needs:
      - build_windows
      - build_macos
      - build_linux
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download packaged applications
        uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          path: release-assets
          merge-multiple: true

      - name: Create SHA-256 checksums
        working-directory: release-assets
        run: sha256sum Crosstalk-* > SHA256SUMS.txt

      - name: Create or update draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release-assets/* --clobber
          else
            gh release create "$RELEASE_TAG" release-assets/* --draft --generate-notes --verify-tag --title "Crosstalk $RELEASE_TAG"
          fi

  build_docker:
    name: Container images
    needs: validate_release
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push container images
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.ref_name }}
          labels: |
            org.opencontainers.image.title=Crosstalk
            org.opencontainers.image.description=Docker image for Crosstalk
            org.opencontainers.image.url=https://github.com/${{ github.repository }}/pkgs/container/crosstalk/
